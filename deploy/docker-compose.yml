services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: betting
      POSTGRES_PASSWORD: betting
      POSTGRES_DB: betting
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U betting -d betting"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - ./localstack-init.sh:/etc/localstack/init/ready.d/init.sh:ro

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak-realm.json:/opt/keycloak/data/import/realm.json:ro

  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["/app/migrate", "-dir", "/app/migrations"]
    environment:
      DATABASE_URL: postgres://betting:betting@postgres:5432/betting?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  processor:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://betting:betting@postgres:5432/betting?sslmode=disable
      OIDC_ISSUER: http://keycloak:8080/realms/betting
      OIDC_AUDIENCE: betting-api
      AWS_REGION: us-east-1
      AWS_ENDPOINT: http://localstack:4566
      SQS_WAGER_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      SQS_OUTBOX_QUEUE_URL: http://localstack:4566/000000000000/wallet-events.fifo
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_started
      keycloak:
        condition: service_started
